[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thyron-store"
version = "0.1.0"
description = "Central de aplicativos do THYRON OS"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["thyron_store*"]

[project.scripts]
thyron-store = "thyron_store.ui:main"

[tool.setuptools.package-data]
thyron_store = ["assets/*.png"]

[tool.setuptools.data-files]
"share/applications" = ["packaging/org.thyron.Store.desktop"]
"share/icons/hicolor/48x48/apps" = ["packaging/icons/hicolor/48x48/apps/thyron-store.png"]
"share/icons/hicolor/128x128/apps" = ["packaging/icons/hicolor/128x128/apps/thyron-store.png"]
"share/icons/hicolor/256x256/apps" = ["packaging/icons/hicolor/256x256/apps/thyron-store.png"]
"share/icons/hicolor/512x512/apps" = ["packaging/icons/hicolor/512x512/apps/thyron-store.png"]
